name: CI

on:
  pull_request:
    branches: [DEV]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore HouseholdFinances.slnx

      - name: Build
        run: dotnet build HouseholdFinances.slnx -c Release --no-restore

      - name: Test
        run: dotnet test HouseholdFinances.slnx -c Release --no-restore --no-build
